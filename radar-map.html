<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <title>Peta Radar Cuaca BMKG Indonesia</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 1200px;
      height: 750px;
      overflow: hidden;
      background: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #map {
      width: 1200px;
      height: 750px;
      position: relative;
    }
    .banner {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.92);
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
    }
    .banner h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .banner p {
      margin: 4px 0 0;
      font-size: 12px;
      color: #cbd5e1;
    }
    .legend {
      position: absolute;
      bottom: 22px;
      right: 22px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.92);
      color: #ffffff;
      padding: 12px 18px;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
    }
    .legend-title {
      font-size: 12px;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 6px;
    }
    .legend-bar {
      height: 14px;
      width: 260px;
      border-radius: 4px;
      background: linear-gradient(to right, #005ce6, #00c5ff, #38a800, #4ce600, #ffff00, #ffd37f, #e69800, #ff0000);
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.3);
    }
    .legend-labels {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #94a3b8;
      margin-top: 4px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div id="map">
    <div class="banner">
      <h1 id="banner-title">📡 PETA RADAR HUJAN BMKG</h1>
      <p id="timestamp">Memuat data observasi radar BMKG...</p>
    </div>

    <div class="legend">
      <div class="legend-title">Reflektivitas Radar BMKG (dBZ)</div>
      <div class="legend-bar"></div>
      <div class="legend-labels">
        <span>Ringan (5)</span>
        <span>Sedang (25)</span>
        <span>Lebat (40)</span>
        <span>Ekstrem (>55)</span>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const region = (urlParams.get('region') || 'nasional').toLowerCase();

    let center = [-2.2, 118.0];
    let zoom = 5;
    let title = "📡 RADAR BMKG: NASIONAL (INDONESIA)";

    if (region === 'rumah') {
      center = [-2.5858, 104.12295];
      zoom = 10;
      title = "🏠 RADAR BMKG: SEKITAR RUMAH (SUNGAI LILIN)";
    } else if (region === 'palembang' || region === 'sumsel') {
      center = [-2.99, 104.75];
      zoom = 8;
      title = "📡 RADAR BMKG: PALEMBANG & SUMSEL";
    } else if (region === 'jawa') {
      center = [-7.15, 109.8];
      zoom = 7;
      title = "📡 RADAR BMKG: JAWA, BALI & SEKITARNYA";
    } else if (region === 'sumatera') {
      center = [-0.5, 101.5];
      zoom = 6;
      title = "📡 RADAR BMKG: SUMATERA";
    } else if (region === 'kalimantan') {
      center = [-0.2, 113.8];
      zoom = 6;
      title = "📡 RADAR BMKG: KALIMANTAN";
    } else if (region === 'sulawesi') {
      center = [-2.2, 121.2];
      zoom = 6;
      title = "📡 RADAR BMKG: SULAWESI";
    }

    document.getElementById('banner-title').innerText = title;

    const map = L.map('map', {
      zoomControl: false,
      attributionControl: false
    }).setView(center, zoom);

    if (region === 'rumah') {
      const houseIcon = L.divIcon({
        className: 'house-marker',
        html: '<div style="background:#ef4444; width:22px; height:22px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 14px rgba(239,68,68,0.9); display:flex; align-items:center; justify-content:center; font-size:12px;">🏠</div>',
        iconSize: [26, 26],
        iconAnchor: [13, 13]
      });
      L.marker([-2.5858, 104.12295], { icon: houseIcon, zIndexOffset: 1000 }).addTo(map);
    }

    // Peta dasar Esri World Street Map (peta jalan & nama kota yang sangat jelas)
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 18,
      attribution: 'Esri'
    }).addTo(map);

    async function loadRealtimeRadar() {
      try {
        const res = await fetch('https://api.rainviewer.com/public/weather-maps.json');
        if (!res.ok) throw new Error("Gagal mengambil data RainViewer: " + res.status);
        const data = await res.json();
        const host = data.host;
        const latest = data.radar.past[data.radar.past.length - 1];

        const radarTime = new Date(latest.time * 1000);
        const timeStr = radarTime.toLocaleString('id-ID', {
          timeZone: 'Asia/Jakarta',
          dateStyle: 'full',
          timeStyle: 'medium'
        });
        document.getElementById('timestamp').innerText = 'Observasi Radar Cuaca Realtime: ' + timeStr + ' WIB';

        const radarUrl = `${host}${latest.path}/256/{z}/{x}/{y}/2/1_1.png`;
        const radarLayer = L.tileLayer(radarUrl, {
          opacity: 0.85,
          zIndex: 500,
          maxZoom: 12
        }).addTo(map);

        let doneFired = false;
        const markDone = () => {
          if (doneFired) return;
          doneFired = true;
          setTimeout(() => {
            window.__RADAR_DONE__ = true;
          }, 800);
        };

        radarLayer.on('load', markDone);
        radarLayer.on('tileerror', markDone);
        setTimeout(markDone, 4000);
      } catch (err) {
        console.error("Setup error:", err);
        window.__RADAR_ERROR__ = err.message;
        window.__RADAR_DONE__ = true;
      }
    }

    map.whenReady(() => {
      setTimeout(loadRealtimeRadar, 400);
    });
  </script>
</body>
</html>
