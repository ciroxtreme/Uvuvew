<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <title>Peta Radar Cuaca BMKG Indonesia</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 1200px;
      height: 750px;
      overflow: hidden;
      background: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #map {
      width: 1200px;
      height: 750px;
      position: relative;
    }
    .banner {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.92);
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
    }
    .banner h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .banner p {
      margin: 4px 0 0;
      font-size: 12px;
      color: #cbd5e1;
    }
    .legend {
      position: absolute;
      bottom: 22px;
      right: 22px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.92);
      color: #ffffff;
      padding: 12px 18px;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
    }
    .legend-title {
      font-size: 12px;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 6px;
    }
    .legend-bar {
      height: 14px;
      width: 260px;
      border-radius: 4px;
      background: linear-gradient(to right, #005ce6, #00c5ff, #38a800, #4ce600, #ffff00, #ffd37f, #e69800, #ff0000);
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.3);
    }
    .legend-labels {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #94a3b8;
      margin-top: 4px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div id="map">
    <div class="banner">
      <h1 id="banner-title">📡 PETA RADAR HUJAN BMKG</h1>
      <p id="timestamp">Memuat data observasi radar BMKG...</p>
    </div>

    <div class="legend">
      <div class="legend-title">Reflektivitas Radar BMKG (dBZ)</div>
      <div class="legend-bar"></div>
      <div class="legend-labels">
        <span>Ringan (5)</span>
        <span>Sedang (25)</span>
        <span>Lebat (40)</span>
        <span>Ekstrem (>55)</span>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const region = (urlParams.get('region') || 'nasional').toLowerCase();

    let center = [-2.2, 118.0];
    let zoom = 5;
    let title = "📡 RADAR BMKG: NASIONAL (INDONESIA)";

    if (region === 'rumah') {
      center = [-2.5858, 104.12295];
      zoom = 10;
      title = "🏠 RADAR & SATELIT: SEKITAR RUMAH (SUNGAI LILIN)";
    } else if (region === 'palembang' || region === 'sumsel') {
      center = [-2.99, 104.75];
      zoom = 8;
      title = "📡 RADAR & SATELIT: PALEMBANG & SUMSEL";
    } else if (region === 'jawa') {
      center = [-7.15, 109.8];
      zoom = 7;
      title = "📡 RADAR BMKG: JAWA, BALI & SEKITARNYA";
    } else if (region === 'sumatera' || region === 'mosaik') {
      center = [-0.5, 101.5];
      zoom = 6;
      title = "📡 RADAR DOPPLER BMKG: SUMATERA (MOSAIK)";
    } else if (region === 'kalimantan') {
      center = [-0.2, 113.8];
      zoom = 6;
      title = "📡 RADAR BMKG: KALIMANTAN";
    } else if (region === 'sulawesi') {
      center = [-2.2, 121.2];
      zoom = 6;
      title = "📡 RADAR BMKG: SULAWESI";
    }

    document.getElementById('banner-title').innerText = title;

    const map = L.map('map', {
      zoomControl: false,
      attributionControl: false
    }).setView(center, zoom);

    if (region === 'rumah') {
      const houseIcon = L.divIcon({
        className: 'house-marker',
        html: '<div style="background:#ef4444; width:22px; height:22px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 14px rgba(239,68,68,0.9); display:flex; align-items:center; justify-content:center; font-size:12px;">🏠</div>',
        iconSize: [26, 26],
        iconAnchor: [13, 13]
      });
      L.marker([-2.5858, 104.12295], { icon: houseIcon, zIndexOffset: 1000 }).addTo(map);
    }

    // Peta dasar OpenStreetMap Standar Publik (Gratis, Tanpa Token, Cepat & Lengkap)
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    window.radarOverlays = [];
    window.radarFrameTimes = [];
    window.setRadarFrame = function(idx) {
      if (!window.radarOverlays || window.radarOverlays.length === 0) return;
      window.radarOverlays.forEach((ovl, i) => {
        ovl.setOpacity(i === idx ? 0.85 : 0);
      });
      if (window.radarFrameTimes && window.radarFrameTimes[idx]) {
        document.getElementById('timestamp').innerText = 'Observasi Radar Doppler BMKG: ' + window.radarFrameTimes[idx];
      }
    };

    async function loadRealtimeRadar() {
      try {
        const isLocalDoppler = (region === 'rumah' || region === 'palembang' || region === 'sumsel' || region === 'mosaik' || region === 'sumatera');

        // Lapisan Satelit HANYA aktif jika BUKAN mode mosaik Sumatera murni
        const isMosaikSumatera = (region === 'sumatera' || region === 'mosaik');
        const himaUrl = 'https://inderaja.bmkg.go.id/IMAGE/HIMA/H08_RP_Indonesia.png?_t=' + Date.now();
        const himaBounds = [[20.000000, 90.000000], [-20.000000, 150.000000]];
        let himaLayer = null;
        if (!isMosaikSumatera) {
          himaLayer = L.imageOverlay(himaUrl, himaBounds, {
            opacity: isLocalDoppler ? 0.40 : 0.85,
            zIndex: 350
          }).addTo(map);
        }

        if (isLocalDoppler) {
          // Sesuaikan Bounding Box Overlay jika Region Sumatera / Mosaik
          let bounds = [[-4.5, 102.5], [-1.5, 106.0]];
          if (region === 'sumatera' || region === 'mosaik') {
            bounds = [[-6.2, 94.5], [6.2, 107.0]];
          }
          // Bounds Radar Sumsel & Sekitarnya (BMKG Mosaic CMAX BBOX: 102.5, -4.5, 106.0, -1.5)
          // bounds dinamis
          
          let frames = [];
          // 1. Coba ambil frame live BMKG resmi dari Cloudflare Worker / GitHub
          try {
            const apiUrl = (new URLSearchParams(window.location.search)).get('api') || 'https://telegram.ciroxtreme.workers.dev/api/radar-frames';
            const res = await fetch(apiUrl);
            if (res.ok) {
              const data = await res.json();
              if (data && data.frames && data.frames.length > 0) {
                frames = data.frames.map(f => {
                  const matchTime = (f.path || f.url || "").match(/([0-9]{4})([0-9]{2})([0-9]{2})([0-9]{2})([0-9]{2})/);
                  let frameTimestamp = Date.now();
                  if (matchTime) {
                    const d = new Date(Date.UTC(parseInt(matchTime[1]), parseInt(matchTime[2]) - 1, parseInt(matchTime[3]), parseInt(matchTime[4]), parseInt(matchTime[5])));
                    frameTimestamp = d.getTime();
                  }
                  return {
                    url: f.url,
                    timeLabel: f.timeLabel || "Live WIB",
                    timestamp: frameTimestamp
                  };
                });
              }
            }
          } catch(e) {
            console.warn("Gagal fetch worker radar-frames API:", e);
          }

          // Fallback legacy jika api kosong
          if (frames.length === 0) {
            try {
              const resLegacy = await fetch('https://raw.githubusercontent.com/ciroxtreme/Uvuvew/main/radar-frames.json');
              if (resLegacy.ok) {
                const legData = await resLegacy.json();
                if (legData && legData.frames) {
                  frames = legData.frames.map(f => ({
                    url: f.url,
                    timeLabel: f.timeLabel || "Live WIB",
                    timestamp: Date.now()
                  }));
                }
              }
            } catch(e2) {
              console.warn("Gagal fetch fallback GitHub:", e2);
            }
          }

          const now = new Date();
          const nowTimeStr = now.toLocaleTimeString('id-ID', { timeZone: 'Asia/Jakarta', hour: '2-digit', minute: '2-digit' }) + ' WIB';

          // Cek apakah Doppler radar BMKG lokal macet / usang (> 2 jam yang lalu)
          let isDopplerStale = false;
          // Khusus mode Mosaik Sumatera, JANGAN PERNAH fallback ke Himawari! Selalu tampilkan radar Doppler murni!
          if (!isMosaikSumatera && frames.length > 0) {
            const latestFrameTime = frames[frames.length - 1].timestamp;
            if (latestFrameTime && (Date.now() - latestFrameTime > 2 * 3600 * 1000)) {
              isDopplerStale = true;
              console.warn("⚠️ Doppler BMKG Sumsel usang (> 2 jam). Auto-fallback ke Satelit Himawari-9 Live!");
            }
          }

          if (frames.length > 0 && !isDopplerStale) {
            window.radarFrameTimes = frames.map(f => f.timeLabel);
            window.radarOverlays = [];

            frames.forEach((f, idx) => {
              const isLatest = (idx === frames.length - 1);
              const ovl = L.imageOverlay(f.url, bounds, {
                opacity: isLatest ? 0.85 : 0,
                zIndex: 500 + idx
              }).addTo(map);
              window.radarOverlays.push(ovl);
            });

            document.getElementById('timestamp').innerText = 'Observasi Radar Doppler & Satelit BMKG: ' + frames[frames.length - 1].timeLabel;
          } else {
            // Doppler tidak tersedia atau sedang macet -> Tampilkan Satelit Himawari-9 Real-Time jika bukan mosaik
            if (himaLayer) himaLayer.setOpacity(0.88);
            document.getElementById('timestamp').innerText = 'Observasi Satelit Himawari-9 Live: ' + nowTimeStr;
            frames = []; // Nonaktifkan deteksi radar usang agar tidak salah kirim alert
          }

          // Hitung deteksi sel awan hujan di sekitar Rumah Sungai Lilin (Doppler BMKG atau Fallback Satelit Himawari-9 BMKG)
          if (region === 'rumah') {
            if (frames.length > 0 && !isDopplerStale) {
              // MODE 1: Doppler Radar BMKG Lokal Aktif
              try {
                const latestImgUrl = frames[frames.length - 1].url;
                const imgEl = new Image();
                imgEl.crossOrigin = 'anonymous';
                imgEl.onload = function() {
                  try {
                    const cvs = document.createElement('canvas');
                    cvs.width = imgEl.naturalWidth || 600;
                    cvs.height = imgEl.naturalHeight || 600;
                    const ctx = cvs.getContext('2d');
                    ctx.drawImage(imgEl, 0, 0);

                    // Koordinat Sungai Lilin pada Citra Mosaic BMKG (BBOX: lon 102.5 s/d 106.0, lat -4.5 s/d -1.5)
                    // Lon range = 3.5 deg, Lat range = 3.0 deg
                    // Sungai Lilin: lon 104.12295, lat -2.5858
                    const cx = Math.round((104.12295 - 102.5) / 3.5 * cvs.width);
                    const cy = Math.round(((-1.5) - (-2.5858)) / 3.0 * cvs.height);
                    const checkRadius = Math.round(cvs.width * 0.05); // ~20 km radius pantauan

                    const x0 = Math.max(0, cx - checkRadius);
                    const y0 = Math.max(0, cy - checkRadius);
                    const wArea = Math.min(cvs.width - x0, checkRadius * 2);
                    const hArea = Math.min(cvs.height - y0, checkRadius * 2);

                    const imgData = ctx.getImageData(x0, y0, wArea, hArea).data;
                    let rainPixels = 0;
                    let heavyRainPixels = 0;
                    let minDistancePx = 999;

                    for (let py = 0; py < hArea; py++) {
                      for (let px = 0; px < wArea; px++) {
                        const idx = (py * wArea + px) * 4;
                        const a = imgData[idx + 3];
                        if (a > 60) {
                          const dist = Math.sqrt((px - (cx - x0)) ** 2 + (py - (cy - y0)) ** 2);
                          if (dist <= checkRadius) {
                            rainPixels++;
                            if (dist < minDistancePx) minDistancePx = dist;
                            const r = imgData[idx];
                            // Kuning, Oranye, Merah (hujan sedang-lebat / dBZ >= 35)
                            if (r > 200) {
                              heavyRainPixels++;
                            }
                          }
                        }
                      }
                    }

                    const kmDist = minDistancePx < 999 ? Math.round(minDistancePx * 0.67) : null;
                    window.__RAIN_DETECTION__ = {
                      sensor: "radar_doppler",
                      hasRain: rainPixels >= 6,
                      rainPixels,
                      heavyRainPixels,
                      distanceKm: kmDist,
                      isHeavy: heavyRainPixels >= 4,
                      obsTime: frames[frames.length - 1].timeLabel
                    };
                    console.log("🌦️ Deteksi Hujan Doppler Sekitar Rumah:", window.__RAIN_DETECTION__);
                  } catch(e) {
                    console.warn("Gagal deteksi canvas radar doppler:", e);
                  }
                };
                imgEl.src = latestImgUrl;
              } catch (errDet) {
                console.warn("Gagal inisialisasi deteksi hujan doppler:", errDet);
              }
            } else {
              // MODE 2: FALLBACK SATELIT HIMAWARI-9 POTENSI HUJAN BMKG (Selalu Live 24/7)
              try {
                const satImg = new Image();
                satImg.crossOrigin = 'anonymous';
                satImg.onload = function() {
                  try {
                    const cvs = document.createElement('canvas');
                    cvs.width = satImg.naturalWidth || 1200;
                    cvs.height = satImg.naturalHeight || 800;
                    const ctx = cvs.getContext('2d');
                    ctx.drawImage(satImg, 0, 0);

                    // Bounds Himawari Indonesia: Lat [20 to -20], Lon [90 to 150]
                    // Koordinat Rumah Sungai Lilin: Lat -2.5858, Lon 104.12295
                    const cx = Math.round((104.12295 - 90.0) / (150.0 - 90.0) * cvs.width);
                    const cy = Math.round((20.0 - (-2.5858)) / (20.0 - (-20.0)) * cvs.height);
                    const satRadius = 25; // radius pantauan sekitar rumah

                    const x0 = Math.max(0, cx - satRadius);
                    const y0 = Math.max(0, cy - satRadius);
                    const wArea = Math.min(cvs.width - x0, satRadius * 2);
                    const hArea = Math.min(cvs.height - y0, satRadius * 2);

                    const imgData = ctx.getImageData(x0, y0, wArea, hArea).data;
                    let satRainPixels = 0;
                    let satHeavyPixels = 0;

                    for (let py = 0; py < hArea; py++) {
                      for (let px = 0; px < wArea; px++) {
                        const idx = (py * wArea + px) * 4;
                        const r = imgData[idx];
                        const g = imgData[idx + 1];
                        const b = imgData[idx + 2];
                        const a = imgData[idx + 3];

                        if (a > 50) {
                          // Deteksi spektrum awan hujan Himawari Potensi Hujan (Kuning, Oranye, Merah, Ungu)
                          const isRedOrange = (r > 180 && b < 100);
                          const isYellow = (r > 180 && g > 180 && b < 120);
                          const isCyanGreen = (g > 150 && b > 120);

                          if (isRedOrange || isYellow || isCyanGreen) {
                            satRainPixels++;
                            if (isRedOrange) satHeavyPixels++;
                          }
                        }
                      }
                    }

                    window.__RAIN_DETECTION__ = {
                      sensor: "satelit_himawari",
                      hasRain: satRainPixels >= 8,
                      rainPixels: satRainPixels,
                      heavyRainPixels: satHeavyPixels,
                      distanceKm: 0,
                      isHeavy: satHeavyPixels >= 3,
                      obsTime: nowTimeStr
                    };
                    console.log("🛰️ Deteksi Hujan Satelit Himawari-9 Sekitar Rumah:", window.__RAIN_DETECTION__);
                  } catch(e) {
                    console.warn("Gagal deteksi canvas satelit himawari:", e);
                  }
                };
                satImg.src = himaUrl;
              } catch (errSat) {
                console.warn("Gagal inisialisasi satelit himawari:", errSat);
              }
            }
          }

          setTimeout(() => { window.__RADAR_DONE__ = true; }, 1800);
        } else {
          // Region Nasional, Sumatera, Jawa dll.
          const now = new Date();
          const timeStr = now.toLocaleString('id-ID', {
            timeZone: 'Asia/Jakarta',
            dateStyle: 'full',
            timeStyle: 'medium'
          });
          document.getElementById('timestamp').innerText = 'Observasi Satelit Hujan BMKG: ' + timeStr + ' WIB';

          setTimeout(() => { window.__RADAR_DONE__ = true; }, 1800);
        }
      } catch (err) {
        console.error("Setup error:", err);
        window.__RADAR_ERROR__ = err.message;
        window.__RADAR_DONE__ = true;
      }
    }

    map.whenReady(() => {
      setTimeout(loadRealtimeRadar, 400);
    });
  </script>
</body>
</html>
