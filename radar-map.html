<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <title>Peta Radar Cuaca BMKG Indonesia</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 1200px;
      height: 750px;
      overflow: hidden;
      background: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #map {
      width: 1200px;
      height: 750px;
      position: relative;
    }
    .banner {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.92);
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
    }
    .banner h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .banner p {
      margin: 4px 0 0;
      font-size: 12px;
      color: #cbd5e1;
    }
    .legend {
      position: absolute;
      bottom: 22px;
      right: 22px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.92);
      color: #ffffff;
      padding: 12px 18px;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
    }
    .legend-title {
      font-size: 12px;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 6px;
    }
    .legend-bar {
      height: 14px;
      width: 260px;
      border-radius: 4px;
      background: linear-gradient(to right, #005ce6, #00c5ff, #38a800, #4ce600, #ffff00, #ffd37f, #e69800, #ff0000);
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.3);
    }
    .legend-labels {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #94a3b8;
      margin-top: 4px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div id="map">
    <div class="banner">
      <h1 id="banner-title">📡 PETA RADAR HUJAN BMKG</h1>
      <p id="timestamp">Memuat data observasi radar BMKG...</p>
    </div>

    <div class="legend">
      <div class="legend-title">Reflektivitas Radar BMKG (dBZ)</div>
      <div class="legend-bar"></div>
      <div class="legend-labels">
        <span>Ringan (5)</span>
        <span>Sedang (25)</span>
        <span>Lebat (40)</span>
        <span>Ekstrem (>55)</span>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const region = (urlParams.get('region') || 'nasional').toLowerCase();

    let center = [-2.2, 118.0];
    let zoom = 5;
    let title = "📡 RADAR BMKG: NASIONAL (INDONESIA)";

    if (region === 'rumah') {
      center = [-2.5858, 104.12295];
      zoom = 10;
      title = "🏠 RADAR BMKG: SEKITAR RUMAH (SUNGAI LILIN)";
    } else if (region === 'palembang' || region === 'sumsel') {
      center = [-2.99, 104.75];
      zoom = 8;
      title = "📡 RADAR BMKG: PALEMBANG & SUMSEL";
    } else if (region === 'jawa') {
      center = [-7.15, 109.8];
      zoom = 7;
      title = "📡 RADAR BMKG: JAWA, BALI & SEKITARNYA";
    } else if (region === 'sumatera') {
      center = [-0.5, 101.5];
      zoom = 6;
      title = "📡 RADAR BMKG: SUMATERA";
    } else if (region === 'kalimantan') {
      center = [-0.2, 113.8];
      zoom = 6;
      title = "📡 RADAR BMKG: KALIMANTAN";
    } else if (region === 'sulawesi') {
      center = [-2.2, 121.2];
      zoom = 6;
      title = "📡 RADAR BMKG: SULAWESI";
    }

    document.getElementById('banner-title').innerText = title;

    const map = L.map('map', {
      zoomControl: false,
      attributionControl: false
    }).setView(center, zoom);

    if (region === 'rumah') {
      const houseIcon = L.divIcon({
        className: 'house-marker',
        html: '<div style="background:#ef4444; width:22px; height:22px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 14px rgba(239,68,68,0.9); display:flex; align-items:center; justify-content:center; font-size:12px;">🏠</div>',
        iconSize: [26, 26],
        iconAnchor: [13, 13]
      });
      L.marker([-2.5858, 104.12295], { icon: houseIcon, zIndexOffset: 1000 }).addTo(map);
    }

    // Peta dasar Esri World Street Map (peta jalan & nama kota yang sangat jelas)
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 18,
      attribution: 'Esri'
    }).addTo(map);

    window.radarOverlays = [];
    window.radarFrameTimes = [];
    window.setRadarFrame = function(idx) {
      if (!window.radarOverlays || window.radarOverlays.length === 0) return;
      window.radarOverlays.forEach((ovl, i) => {
        ovl.setOpacity(i === idx ? 0.85 : 0);
      });
      if (window.radarFrameTimes && window.radarFrameTimes[idx]) {
        document.getElementById('timestamp').innerText = 'Observasi Radar Doppler BMKG: ' + window.radarFrameTimes[idx];
      }
    };

    async function loadRealtimeRadar() {
      try {
        const isLocalDoppler = (region === 'rumah' || region === 'palembang' || region === 'sumsel');

        if (isLocalDoppler) {
          const bounds = [[-2.917444 - 1.8, 104.702556 - 1.8], [-2.917444 + 1.8, 104.702556 + 1.8]];
          
          let frames = [];
          try {
            const res = await fetch('https://radar.cuacasumsel.com/');
            const html = await res.text();
            const matches = [...html.matchAll(/var MyDateString([0-9]{2})\s*=\s*['"]([^'"]+)['"]/g)];
            if (matches.length > 0) {
              frames = matches.map(m => {
                const path = m[2];
                const matchTime = path.match(/([0-9]{4})([0-9]{2})([0-9]{2})([0-9]{2})([0-9]{2})/);
                let timeLabel = "";
                if (matchTime) {
                  const d = new Date(Date.UTC(parseInt(matchTime[1]), parseInt(matchTime[2]) - 1, parseInt(matchTime[3]), parseInt(matchTime[4]), parseInt(matchTime[5])));
                  timeLabel = d.toLocaleTimeString('id-ID', { timeZone: 'Asia/Jakarta', hour: '2-digit', minute: '2-digit' }) + ' WIB';
                }
                return {
                  url: 'https://radar.cuacasumsel.com/' + path,
                  timeLabel
                };
              }).reverse();
            }
          } catch(e) {
            console.warn("Gagal fetch daftar frame radar:", e);
          }

          if (frames.length === 0) {
            frames = [{
              url: urlParams.get('radarImg') || 'https://radar.cuacasumsel.com/radar/2026-10-10/2026101009103000dBZ.cmax.0.png',
              timeLabel: new Date().toLocaleTimeString('id-ID', { timeZone: 'Asia/Jakarta', hour: '2-digit', minute: '2-digit' }) + ' WIB'
            }];
          }

          window.radarFrameTimes = frames.map(f => f.timeLabel);
          window.radarOverlays = [];

          frames.forEach((f, idx) => {
            const isLatest = (idx === frames.length - 1);
            const ovl = L.imageOverlay(f.url, bounds, {
              opacity: isLatest ? 0.85 : 0,
              zIndex: 500 + idx
            }).addTo(map);
            window.radarOverlays.push(ovl);
          });

          document.getElementById('timestamp').innerText = 'Observasi Radar Doppler BMKG: ' + frames[frames.length - 1].timeLabel;
          setTimeout(() => { window.__RADAR_DONE__ = true; }, 1200);
        } else {
          // Radar Satelit Potensi Curah Hujan BMKG Nasional
          const himaUrl = 'https://inderaja.bmkg.go.id/IMAGE/HIMA/H08_RP_Indonesia.png';
          const bounds = [[20.000000, 90.000000], [-20.000000, 150.000000]];
          const overlay = L.imageOverlay(himaUrl, bounds, {
            opacity: 0.85,
            zIndex: 500
          }).addTo(map);

          const now = new Date();
          const timeStr = now.toLocaleString('id-ID', {
            timeZone: 'Asia/Jakarta',
            dateStyle: 'full',
            timeStyle: 'medium'
          });
          document.getElementById('timestamp').innerText = 'Observasi Radar Hujan BMKG: ' + timeStr + ' WIB';

          overlay.on('load', () => { setTimeout(() => { window.__RADAR_DONE__ = true; }, 800); });
          overlay.on('error', () => { setTimeout(() => { window.__RADAR_DONE__ = true; }, 800); });
          setTimeout(() => { window.__RADAR_DONE__ = true; }, 3500);
        }
      } catch (err) {
        console.error("Setup error:", err);
        window.__RADAR_ERROR__ = err.message;
        window.__RADAR_DONE__ = true;
      }
    }

    map.whenReady(() => {
      setTimeout(loadRealtimeRadar, 400);
    });
  </script>
</body>
</html>
