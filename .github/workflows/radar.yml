name: Scrape Radar Cuaca BMKG

on:
  schedule:
    - cron: '*/10 * * * *'  # Aktif setiap 10 menit
  workflow_dispatch:        # Bisa dijalankan manual lewat tombol 'Run workflow'
  repository_dispatch:      # Bisa dipanggil dari Cloudflare Worker / Webhook
    types: [scrape_radar, mosaic_sumatra]

# Proteksi Anti-Spam & Anti-Tumpuk: Maksimal hanya 1 antrean yang jalan
concurrency:
  group: radar-scrape
  cancel-in-progress: false

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies & Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm-dev ffmpeg

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: npm install

      - name: Setup Python & Pillow for Tile Stitching
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: pip install Pillow

      - name: Install & Configure Cloudflare WARP (SOCKS5 Mode)
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -y
          sudo apt-get install -y cloudflare-warp
          sudo warp-cli --accept-tos registration new || true
          sudo warp-cli --accept-tos mode proxy
          sudo warp-cli --accept-tos proxy port 40000
          sudo warp-cli --accept-tos connect
          sleep 5
          warp-cli --accept-tos status || true
          curl -x socks5://127.0.0.1:40000 https://cloudflare.com/cdn-cgi/trace

      - name: Download & Run Precompiled cfsolve Engine (via Local WARP)
        continue-on-error: true
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          echo "⚡ Mengunduh precompiled cfsolve native binary dari GitHub Release (instant)..."
          curl -L -o cfsolve_bin.tar.gz https://github.com/ciroxtreme/Uvuvew/releases/download/cfsolve-bin-v1/export_bmkg_radar_linux_x86_64.tar.gz
          tar -zxvf cfsolve_bin.tar.gz
          chmod +x export_bmkg_radar_linux_x86_64
          echo "🚀 Menjalankan cfsolve Turnstile solver via Local WARP Tunnel (Fallback ke PROXY_URL jika ada)..."
          PROXY_ARG="--proxy socks5://127.0.0.1:40000"
          if [ -n "$PROXY_URL" ]; then
            PROXY_ARG="--proxy $PROXY_URL"
          fi
          ./export_bmkg_radar_linux_x86_64 . $PROXY_ARG || true

      - name: Stitch WMS Tiles into Seamless Full Sumatera Radar Frames
        run: |
          python3 stitch_tiles.py || true
          python3 render_mosaik.py || true

      - name: Run Radar Map Compositor & Telegram Dispatcher
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          USER_CHAT_ID: ${{ secrets.USER_CHAT_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" node scraper.js

      - name: Commit & Push radar-frames.json & radar images for GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: update radar frames & mosaik layers [skip ci]"
            for i in 1 2 3 4 5; do
              git fetch origin main && git rebase origin/main && git push origin main && break || (git rebase --abort 2>/dev/null || true; sleep 2)
            done
          fi
