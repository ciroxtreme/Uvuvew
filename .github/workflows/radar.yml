name: Scrape Radar Cuaca BMKG

on:
  schedule:
    # Menit off-peak (bukan tepat 00/15/30/45) untuk menghindari antrean server GitHub Actions
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:        # Bisa dijalankan manual lewat tombol 'Run workflow' di GitHub Actions
  repository_dispatch:      # Bisa dipanggil dari Cloudflare Worker / Webhook
    types: [scrape_radar]

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install System Dependencies & Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm-dev ffmpeg
          npm install

      - name: Run Radar Scraper with Xvfb
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" node scraper.js

      - name: Commit & Push radar-frames.json for GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add radar-frames.json || true
          git diff --staged --quiet || (git commit -m "chore: update radar frames data [skip ci]" && git push)
