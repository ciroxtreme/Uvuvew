name: Scrape Radar Cuaca BMKG

on:
  schedule:
    - cron: '*/10 23,0-16 * * *'  # Siang WIB 06:00-24:00 tiap 10 menit (UTC 23,0-16)
    - cron: '0 17-22 * * *'  # Malam WIB 00:00-06:00 tiap 1 jam (UTC 17-22)
  workflow_dispatch:        # Bisa dijalankan manual lewat tombol 'Run workflow'
  repository_dispatch:      # Bisa dipanggil dari Cloudflare Worker / Webhook
    types: [scrape_radar, mosaic_sumatra]

# Proteksi Anti-Spam & Anti-Tumpuk: Maksimal hanya 1 antrean yang jalan
concurrency:
  group: radar-scrape
  cancel-in-progress: false

jobs:
  scrape-and-update:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies & Xvfb
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends xvfb libgbm-dev ffmpeg curl gpg

      - name: Install & Setup Official Cloudflare WARP SOCKS5 Tunnel
        run: |
          echo "📥 Memasang Cloudflare WARP client resmi..."
          export DEBIAN_FRONTEND=noninteractive
          curl -fsSL -o /tmp/warp.deb https://pkg.cloudflareclient.com/pool/jammy/main/c/cloudflare-warp/cloudflare-warp_2024.11.309.0_amd64.deb || curl -fsSL -o /tmp/warp.deb https://pkg.cloudflareclient.com/pool/jammy/main/c/cloudflare-warp/cloudflare-warp_2024.6.497.0_amd64.deb || true

          if [ -f /tmp/warp.deb ] && [ $(stat -c%s /tmp/warp.deb) -gt 1000000 ]; then
            sudo dpkg -i /tmp/warp.deb || true
          else
            curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ jammy main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
            sudo apt-get update -y
            sudo apt-get install -y cloudflare-warp
          fi

          sudo systemctl start warp-svc
          sleep 1

          warp-cli --accept-tos registration new || warp-cli --accept-tos register || true
          warp-cli --accept-tos mode proxy || true
          warp-cli --accept-tos proxy port 40000 || true
          warp-cli --accept-tos connect || true

          sleep 2
          echo "✅ Status WARP:"
          warp-cli --accept-tos status || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install --no-audit --no-fund

      - name: Setup Python & Dependencies for Stealth Browser & Tile Stitching
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies & Camoufox Browser
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          python3 -m camoufox fetch

      - name: Download BMKG Radar Tiles via Stealth Browser
        env:
          PROXY_URL: socks5://127.0.0.1:40000
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" python3 download_bmkg_radar.py

      - name: Stitch WMS Tiles into Seamless Full Sumatera Radar Frames
        run: |
          python3 stitch_tiles.py || true
          python3 render_mosaik.py || true

      - name: Run Radar Map Compositor & Telegram Dispatcher
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          USER_CHAT_ID: ${{ secrets.USER_CHAT_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" node scraper.js

      - name: Commit & Push radar-frames.json & radar images for GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Gunakan kutip tunggal pada pathspec 'radar_sumsel_*.png' agar git men-stage file PNG lama yang dihapus sekaligus PNG baru
          git add -A 'radar_sumsel_*.png' radar-frames.json mosaik_sumatera_latest.jpg || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: update radar frames & mosaik layers [skip ci]"
            # Bersihkan perubahan unstaged lain (jika ada) agar git rebase tidak pernah tertahan
            git checkout -- . || true
            for i in 1 2 3 4 5; do
              git fetch origin main && git rebase --autostash origin/main && git push origin main && break || (git rebase --abort 2>/dev/null || true; sleep 2)
            done
          fi
