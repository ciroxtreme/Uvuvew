name: Build & Release Precompiled cfsolve Binary

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev clang cmake

      - name: Build Release Binary
        run: |
          cd cfsolve
          cargo build --release --bin challenge
          cp target/release/challenge ../challenge_linux_x86_64
          cd ..
          strip challenge_linux_x86_64
          tar -czvf challenge_linux_x86_64.tar.gz challenge_linux_x86_64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: challenge-x86_64
          path: challenge_linux_x86_64

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cfsolve-bin-v2
          name: "Precompiled cfsolve Native Engine v2 (challenge)"
          files: challenge_linux_x86_64.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
