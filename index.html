<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Radar Cuaca Interaktif</title>
  
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #fff;
    }
    #map {
      width: 100%; height: 100%;
      position: absolute; top: 0; left: 0; z-index: 1;
    }

    /* Floating Header */
    .top-bar {
      position: absolute; top: 12px; left: 12px; right: 12px;
      z-index: 1000;
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    }
    .top-title {
      font-size: 14px; font-weight: 700; color: #38bdf8;
      display: flex; align-items: center; gap: 6px;
    }
    .time-badge {
      font-size: 11px; font-weight: 500; color: #94a3b8;
      margin-top: 2px;
    }

    .btn-gps {
      background: #0284c7; color: #fff;
      border: none; outline: none;
      padding: 8px 12px; border-radius: 8px;
      font-size: 12px; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; gap: 5px;
      transition: background 0.2s;
    }
    .btn-gps:active { background: #0369a1; }

    /* Bottom Player & Controls */
    .bottom-bar {
      position: absolute; bottom: 20px; left: 12px; right: 12px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
    }
    .player-controls {
      display: flex; align-items: center; gap: 10px; margin-bottom: 8px;
    }
    .btn-play {
      background: #38bdf8; color: #0f172a;
      border: none; border-radius: 50%;
      width: 36px; height: 36px; font-size: 16px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-weight: bold; flex-shrink: 0;
    }
    .slider-container {
      flex: 1; display: flex; flex-direction: column; gap: 2px;
    }
    .slider {
      width: 100%; -webkit-appearance: none; appearance: none;
      height: 6px; border-radius: 3px; background: #334155;
      outline: none;
    }
    .slider::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 16px; height: 16px; border-radius: 50%;
      background: #38bdf8; cursor: pointer;
    }
    .frame-time {
      font-size: 11px; color: #cbd5e1; text-align: right;
    }

    /* Legend */
    .legend-row {
      display: flex; align-items: center; justify-content: space-between;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 8px; margin-top: 4px;
    }
    .legend-title { font-size: 10px; color: #94a3b8; }
    .legend-bar {
      height: 8px; width: 140px; border-radius: 4px;
      background: linear-gradient(to right, #00ecec, #01a0f6, #0000f6, #00e000, #00c000, #ffff00, #e7c000, #ff9000, #ff0000, #d60000, #c00000, #ff00f0, #9600b4);
    }
    .legend-labels {
      font-size: 9px; color: #64748b; display: flex; justify-content: space-between; width: 140px; margin-top: 2px;
    }

    /* Pulsing user GPS dot */
    .gps-pulse {
      width: 16px; height: 16px;
      background: #38bdf8;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 12px #38bdf8;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7); }
      70% { transform: scale(1.1); box-shadow: 0 0 0 14px rgba(56, 189, 248, 0); }
      100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Top Bar -->
  <div class="top-bar">
    <div>
      <div class="top-title">📡 Radar Hujan Realtime</div>
      <div class="time-badge" id="status-text">Memuat radar...</div>
    </div>
    <button class="btn-gps" onclick="detectLocation()">
      📍 Lokasi Saya
    </button>
  </div>

  <!-- Bottom Player & Legend -->
  <div class="bottom-bar">
    <div class="player-controls">
      <button class="btn-play" id="btn-play" onclick="togglePlay()">▶</button>
      <div class="slider-container">
        <input type="range" class="slider" id="timeline" min="0" max="0" value="0" oninput="onSlide(this.value)" />
        <div class="frame-time" id="frame-time">--:-- WIB</div>
      </div>
    </div>
    <div class="legend-row">
      <div class="legend-title">Curah Hujan (dBZ)</div>
      <div>
        <div class="legend-bar"></div>
        <div class="legend-labels">
          <span>Ringan</span>
          <span>Sedang</span>
          <span>Lebat</span>
          <span>Ekstrem</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Inisialisasi Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Inisialisasi Leaflet
    const map = L.map('map', {
      zoomControl: false,
      attributionControl: false
    }).setView([-2.2, 118.0], 5);

    // Peta dasar Esri World Street Map
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 18,
      attribution: 'Esri'
    }).addTo(map);

    let radarLayers = [];
    let radarFrames = [];
    let host = "";
    let currentIndex = 0;
    let isPlaying = false;
    let playInterval = null;
    let userMarker = null;

    // Ambil data frame dari beberapa sumber (Worker API, GitHub Pages static, atau Proxy)
    async function fetchFramesFromSources() {
      const urlParams = new URLSearchParams(window.location.search);
      const apiParam = urlParams.get('api');

      const sources = [];
      if (apiParam) {
        sources.push({ url: apiParam, type: 'json' });
      }
      // Same-origin JSON dari repositori GitHub Pages
      sources.push({ url: './radar-frames.json', type: 'json' });

      // Fallback proxy cuacasumsel
      sources.push({ url: 'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://radar.cuacasumsel.com/'), type: 'html' });
      sources.push({ url: 'https://corsproxy.io/?url=' + encodeURIComponent('https://radar.cuacasumsel.com/'), type: 'html' });

      for (const src of sources) {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 6000);
          const res = await fetch(src.url, { signal: controller.signal });
          clearTimeout(timeoutId);

          if (!res.ok) continue;

          if (src.type === 'json') {
            const data = await res.json();
            if (data && Array.isArray(data.frames) && data.frames.length > 0) {
              return data.frames;
            }
          } else {
            const html = await res.text();
            const matches = [...html.matchAll(/var MyDateString([0-9]{2})\s*=\s*['"]([^'"]+)['"]/g)];
            if (matches.length > 0) {
              return matches.map(m => {
                const path = m[2];
                const matchTime = path.match(/([0-9]{4})([0-9]{2})([0-9]{2})([0-9]{2})([0-9]{2})/);
                let timeLabel = "";
                if (matchTime) {
                  const d = new Date(Date.UTC(parseInt(matchTime[1]), parseInt(matchTime[2]) - 1, parseInt(matchTime[3]), parseInt(matchTime[4]), parseInt(matchTime[5])));
                  timeLabel = d.toLocaleTimeString('id-ID', { timeZone: 'Asia/Jakarta', hour: '2-digit', minute: '2-digit' }) + ' WIB';
                }
                return {
                  id: m[1],
                  url: 'https://radar.cuacasumsel.com/' + path,
                  path: path,
                  timeLabel: timeLabel
                };
              }).reverse();
            }
          }
        } catch (e) {
          // Lanjut ke source berikutnya
        }
      }
      return [];
    }

    // Load data radar BMKG
    async function initRadar() {
      // 1. Selalu pasang layer satelit potensi hujan nasional BMKG
      const himaBounds = [[20.0, 90.0], [-20.0, 150.0]];
      L.imageOverlay('https://inderaja.bmkg.go.id/IMAGE/HIMA/H08_RP_Indonesia.png?_t=' + Date.now(), himaBounds, { opacity: 0.70, zIndex: 400 }).addTo(map);

      // Otomatis cek lokasi pengguna lebih awal
      detectLocation(true);

      document.getElementById('status-text').innerText = 'Memuat Doppler radar...';

      try {
        const bounds = [[-2.917444 - 1.8, 104.702556 - 1.8], [-2.917444 + 1.8, 104.702556 + 1.8]];
        const frames = await fetchFramesFromSources();

        if (frames && frames.length > 0) {
          radarFrames = frames;
          const slider = document.getElementById('timeline');
          slider.max = radarFrames.length - 1;
          slider.value = radarFrames.length - 1;
          currentIndex = radarFrames.length - 1;

          radarFrames.forEach((frame, idx) => {
            const layer = L.imageOverlay(frame.url, bounds, {
              opacity: idx === currentIndex ? 0.88 : 0,
              zIndex: 600
            }).addTo(map);
            radarLayers.push(layer);
          });

          updateDisplayTime(currentIndex);
          document.getElementById('status-text').innerText = 'Radar Doppler BMKG Siap';
          document.getElementById('btn-play').disabled = false;
        } else {
          // Doppler tidak tersedia -> Tampilkan mode satelit Himawari
          document.getElementById('status-text').innerText = 'Citra Satelit BMKG Nasional';
          const nowStr = new Date().toLocaleTimeString('id-ID', { timeZone: 'Asia/Jakarta', hour: '2-digit', minute: '2-digit' }) + ' WIB';
          document.getElementById('frame-time').innerText = nowStr;
          document.getElementById('timeline').disabled = true;
          document.getElementById('btn-play').innerText = '🛰️';
          document.getElementById('btn-play').disabled = true;
        }
      } catch (err) {
        console.error("Radar init error:", err);
        document.getElementById('status-text').innerText = 'Citra Satelit BMKG Aktif';
        const nowStr = new Date().toLocaleTimeString('id-ID', { timeZone: 'Asia/Jakarta', hour: '2-digit', minute: '2-digit' }) + ' WIB';
        document.getElementById('frame-time').innerText = nowStr;
      }
    }

    function showFrame(index) {
      if (!radarFrames || radarFrames.length === 0) return;
      currentIndex = Math.max(0, Math.min(index, radarFrames.length - 1));
      radarLayers.forEach((layer, idx) => {
        layer.setOpacity(idx === currentIndex ? 0.88 : 0);
      });
      document.getElementById('timeline').value = currentIndex;
      updateDisplayTime(currentIndex);
    }

    function updateDisplayTime(index) {
      if (!radarFrames || !radarFrames[index]) return;
      const f = radarFrames[index];
      if (f.timeLabel) {
        document.getElementById('frame-time').innerText = f.timeLabel;
        return;
      }
      const m = (f.path || f.url || '').match(/([0-9]{4})([0-9]{2})([0-9]{2})([0-9]{2})([0-9]{2})/);
      if (m) {
        const d = new Date(Date.UTC(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3]), parseInt(m[4]), parseInt(m[5])));
        const timeStr = d.toLocaleTimeString('id-ID', { timeZone: 'Asia/Jakarta', hour: '2-digit', minute: '2-digit' }) + ' WIB';
        document.getElementById('frame-time').innerText = timeStr;
      }
    }

    function onSlide(val) {
      stopPlay();
      showFrame(parseInt(val, 10));
    }

    function togglePlay() {
      if (!radarFrames || radarFrames.length === 0) return;
      if (isPlaying) {
        stopPlay();
      } else {
        startPlay();
      }
    }

    function startPlay() {
      if (!radarFrames || radarFrames.length === 0) return;
      isPlaying = true;
      document.getElementById('btn-play').innerText = '⏸';
      if (playInterval) clearInterval(playInterval);
      playInterval = setInterval(() => {
        let next = (currentIndex + 1) % radarFrames.length;
        showFrame(next);
      }, 700);
    }

    function stopPlay() {
      isPlaying = false;
      document.getElementById('btn-play').innerText = '▶';
      if (playInterval) {
        clearInterval(playInterval);
        playInterval = null;
      }
    }

    // Deteksi GPS
    function detectLocation(silent = false) {
      if (!navigator.geolocation) {
        if (!silent) alert("Perangkatmu tidak mendukung GPS Geolocation.");
        return;
      }

      document.getElementById('status-text').innerText = 'Mencari lokasi GPS...';

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;

          // Animasi zoom-in ke lokasi pengguna
          map.flyTo([lat, lon], 10, {
            animate: true,
            duration: 1.8
          });

          // Tandai posisi dengan pulsing dot
          if (userMarker) map.removeLayer(userMarker);
          const icon = L.divIcon({
            className: 'gps-pulse',
            iconSize: [16, 16],
            iconAnchor: [8, 8]
          });
          userMarker = L.marker([lat, lon], { icon }).addTo(map)
            .bindPopup("<b>📍 Lokasi Kamu</b>").openPopup();

          document.getElementById('status-text').innerText = 'Terpusat di lokasimu';
        },
        (err) => {
          console.warn("GPS error:", err);
          document.getElementById('status-text').innerText = 'Klik tombol 📍 untuk izinkan GPS';
          if (!silent) {
            alert("Izinkan akses lokasi di browser/Telegram agar peta bisa otomatis zoom ke sekitarmu.");
          }
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
      );
    }

    initRadar();
  </script>
</body>
</html>
